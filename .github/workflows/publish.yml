name: Publish

on:
  release:
    types: [published]

# Trusted publishing: npm accepts this workflow's short-lived OIDC identity,
# so no npm token is stored anywhere.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Set up declared Node baseline
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Require a version-matching tag
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(bun -p "require('./package.json').version")"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Verify and pack the release
        run: bun run prepublishOnly
      # npm trusted publishing needs Node 22.14+ and npm 11.5.1+; the checks
      # above ran on the declared Node 20 baseline.
      - name: Set up Node for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install the npm CLI that supports trusted publishing
        run: npm install --global npm@11.20.0
      - name: Publish the verified tarball to npm
        run: npm publish .release/package.tgz --access public
