name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@cuny-ai-lab"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(bun -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Verify immutable registry version authority
        run: |
          gh api \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            '/orgs/CUNY-AI-Lab/packages/npm/cail-client/versions?per_page=100&state=active' \
            > "$RUNNER_TEMP/cail-client-package-versions.json"
          CAIL_REGISTRY_VERSIONS_FILE="$RUNNER_TEMP/cail-client-package-versions.json" \
            bun run check:release-live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Packages
        run: |
          # setup-node points NPM_CONFIG_USERCONFIG at an .npmrc holding a literal
          # ${NODE_AUTH_TOKEN}, relying on npm to expand it. bun reads that file
          # but does not expand the placeholder, so it reaches the registry
          # unauthenticated and exits 1 straight after packing without saying why.
          # Written to $HOME, not the worktree: prepublishOnly runs check:clean,
          # which refuses to publish from a dirty tree, and an .npmrc in the
          # working directory is exactly that. Kept in one step under one env
          # block so exactly one step ever sees the token.
          unset NPM_CONFIG_USERCONFIG
          printf '@cuny-ai-lab:registry=https://npm.pkg.github.com\n' > "$HOME/.npmrc"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"
          bun publish
        env:
          CAIL_REGISTRY_VERSIONS_FILE: ${{ runner.temp }}/cail-client-package-versions.json
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
