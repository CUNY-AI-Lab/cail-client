name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(bun -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Verify immutable registry version authority
        run: |
          gh api \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            '/orgs/CUNY-AI-Lab/packages/npm/cail-client/versions?per_page=100&state=active' \
            > "$RUNNER_TEMP/cail-client-package-versions.json"
          CAIL_REGISTRY_VERSIONS_FILE="$RUNNER_TEMP/cail-client-package-versions.json" \
            bun run check:release-live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Packages
        run: |
          bun run prepublishOnly
          PUBLISH_DIRECTORY="$(mktemp -d)"
          trap 'rm -rf "$PUBLISH_DIRECTORY"' EXIT
          PACKAGE_VERSION="$(bun -p "require('./package.json').version")"
          PACKAGE_TARBALL="$PUBLISH_DIRECTORY/cuny-ai-lab-cail-client-${PACKAGE_VERSION}.tgz"
          bun pm pack --destination "$PUBLISH_DIRECTORY" --ignore-scripts
          cp package.json "$PUBLISH_DIRECTORY/package.json"
          (
            cd "$PUBLISH_DIRECTORY"
            bun publish \
              --registry=https://npm.pkg.github.com \
              "$PACKAGE_TARBALL"
          )
        env:
          CAIL_REGISTRY_VERSIONS_FILE: ${{ runner.temp }}/cail-client-package-versions.json
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
